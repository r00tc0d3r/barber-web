# SDD Configuration — Style Dealers
# Generated by el Gentleman SDD preflight

project: barber-web
description: "Sistema de turnos online para barbería — Style Dealers"

# Execution
execution_mode: interactive
artifact_store: both # openspec/ + engram

# Testing
strict_tdd: true
test_runner: vitest
test_command: "pnpm test"
typecheck_command: "pnpm typecheck"
e2e_runner: playwright
e2e_command: "pnpm test:e2e"

# Delivery
chained_pr_strategy: force-chained
review_budget: unlimited

# Phase rules
phases:
  explore:
    description: "Analyze current state, identify patterns, risks, and opportunities"
  proposal:
    description: "Define what to build, business rules, scope, non-goals"
  spec:
    description: "Technical specification — APIs, data models, contracts"
  design:
    description: "Architecture decisions, component design, integration plan"
  tasks:
    description: "Break down into reviewable work units"
  apply:
    description: "Implement with strict TDD"
  verify:
    description: "Validate implementation against spec"
  sync:
    description: "Sync artifacts with implementation state"
  archive:
    description: "Finalize and document the change"
